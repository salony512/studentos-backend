version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: studentos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: studentos_pass
      POSTGRES_DB: studentos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: studentos_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:studentos_pass@db:5432/studentos
      SECRET_KEY: change-this-to-a-random-64-char-string-in-production!!
      DEBUG: "False"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5500,https://yourdomain.com"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"   # optional
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
